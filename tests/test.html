<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OG-tools — Tests</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" />
  <style>
    :root {
      --black:  #0a0a0a;
      --dark:   #111111;
      --border: #222222;
      --muted:  #555555;
      --subtle: #888888;
      --light:  #cccccc;
      --white:  #f5f5f5;
      --gold:   #c9a84c;
      --sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    * { box-sizing: border-box; }
    html, body { background: var(--black); color: var(--light); margin: 0; }
    body { font-family: var(--sans); padding: 1.5rem; max-width: 980px; margin: 0 auto; }
    h1 {
      margin: 0 0 0.5rem;
      color: var(--white);
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }
    .mb-eyebrow {
      font-size: 11px;
      color: var(--gold);
      text-transform: uppercase;
      letter-spacing: 0.22em;
      margin: 0 0 0.5rem;
      font-weight: 500;
    }
    .mb-summary {
      font-family: var(--mono);
      font-size: 14px;
      padding: 0.6rem 0.8rem;
      display: inline-block;
      border: 1px solid var(--border);
      background: var(--dark);
      color: var(--white);
      margin-top: 0.5rem;
    }
    .mb-summary.is-pass { border-left: 2px solid var(--gold); }
    .mb-summary.is-fail { border-left: 2px solid #d4524a; color: #f7b3ad; }
    p { color: var(--subtle); font-size: 14px; }
    p code { font-family: var(--mono); color: var(--accent, var(--white)); background: var(--dark); padding: 0 .3rem; border: 1px solid var(--border); }
    ul { list-style: none; padding: 0; margin-top: 1rem; border-top: 1px solid var(--border); }
    li {
      padding: 0.45rem 0.5rem;
      border-bottom: 1px solid var(--border);
      font-family: var(--mono);
      font-size: 12px;
      color: var(--light);
      display: flex;
      gap: 0.75rem;
      align-items: baseline;
    }
    li .mb-tag {
      flex: 0 0 auto;
      width: 3rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      font-size: 10px;
    }
    li.is-pass .mb-tag { color: var(--gold); }
    li.is-fail .mb-tag { color: #f7b3ad; }
    li.is-fail { color: #f7b3ad; }
  </style>
</head>
<body>
  <p class="mb-eyebrow">OG-tools · Test runner</p>
  <h1>Calculation sanity checks</h1>
  <p>Serve the project (e.g. <code>python3 -m http.server 8000</code>) and open this page. Results below.</p>
  <div class="mb-summary" id="summary">Running…</div>
  <ul id="results"></ul>
  <script type="module" src="tests.js"></script>
</body>
</html>
